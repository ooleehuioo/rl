<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome to Lorraine's studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 48px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #aaa;
            font-size: 1.1rem;
            margin-bottom: 32px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card p {
            color: #ccc;
            line-height: 1.8;
            font-size: 1.05rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 1.05rem;
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .link-btn .icon {
            font-size: 1.3rem;
        }

        .footer {
            margin-top: 32px;
            color: #666;
            font-size: 0.85rem;
        }

        .tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin: 4px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头像 -->
        <div class="avatar">😎</div>

        <!-- 名字 -->
        <h1>你好，我是Lorraine</h1>
        <p class="subtitle">🧑‍💻 开发者 · 📝 写作者 · 🚀 终身学习者</p>

        <!-- 介绍卡片 -->
        <div class="card">
            <p>
                欢迎来到我的个人主页！这里是我在互联网上的一片小天地。
                喜欢折腾代码、分享技术、记录生活。
            </p>
            <div style="margin-top: 16px;">
                <span class="tag">HTML</span>
                <span class="tag">CSS</span>
                <span class="tag">JavaScript</span>
                <span class="tag">Python</span>
            </div>
        </div>

        <!-- 链接按钮 -->
        <div class="links">
            <a href="#" class="link-btn">
                <span class="icon">📂</span> 我的项目
            </a>
            <a href="#" class="link-btn">
                <span class="icon">📝</span> 博客文章
            </a>
            <a href="#" class="link-btn">
                <span class="icon">🐙</span> GitHub
            </a>
            <a href="#" class="link-btn">
                <span class="icon">💬</span> 联系我
            </a>
        </div>

        <!-- 页脚 -->
        <p class="footer">
            © 2026 Lorraine · 由 Cloudflare Pages 驱动 · 全世界秒开 🚀
        </p>
    </div>
</body>
</html>
