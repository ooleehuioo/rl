<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sgzhd</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container { text-align: center; max-width: 600px; width: 100%; }    
            
        h1 { text-align: center; margin-bottom: 30px; font-size: 28px; }
        
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
       
        th { background: #2d3436; color: #fff; padding: 16px 20px; text-align: left; font-weight: 300; font-size: 15px; }
       
        td { padding: 16px 20px; border-bottom: 1px solid #eee; font-size: 14px; vertical-align: middle; }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #D1C7E8; }
        .tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 300; }
        .tag-done { background: #e8f5e9; color: #2e7d32; }
        .tag-wip { background: #fff3e0; color: #e65100; }
        .tag-plan { background: #e3f2fd; color: #1565c0; }
        a.link { color: #0984e3; text-decoration: none; font-weight: 500; }
        a.link:hover { text-decoration: underline; }
        @media (max-width: 600px) {
            th, td { padding: 12px 14px; font-size: 13px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stella</h1>
        <table>
            <thead>
                <tr>
                    <th>角色</th>
                    <th>上次最高收入</th>    
                    <th>上次涨幅</th>
                    <th>当前最高</th>
                    <th>拜访加成10%</th>
                    <th>拜访激励加成20%</th>
                </tr>
            </thead>
            <tbody>
                <!-- ✏️ 复制下面这一行来添加新项目 -->
                <tr>
                    <td><strong>Stella</strong></td>
                    <td>6.02亿</td>
                    <td>2840万</td>    
                    <td>6.304亿</td>
                    <td><span class="tag tag-done">6.934亿</span></td>
                    <td><span class="tag tag-done">7.565亿</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
