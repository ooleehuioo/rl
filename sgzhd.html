<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时光杂货店</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff; min-height: 100vh; display: flex; align-items: center; 
            justify-content: center; padding: 20px; flex-direction:column;
            }

        .container { text-align: center; max-width: 600px; width: 100%; 
                     display: flex; align-items: center; justify-content: center; 
                     margin-bottom: 20px; 
                   }    
      .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 16px; padding: 32px; margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px; align-items:center;  width:100%;
        }  
   
      .h1{font-size:20px; font-weight:400; }
       
      
        @media (max-width: 600px) {
            row { padding: 12px 14px; font-size: 13px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stella</h1>
        <p class="subtitle">🧑‍💻 收入 · 📝 战力 · 🚀 魅力</p>

            <p>分享一些个人游戏经验</p>
            <div style="margin-top: 16px;">

                <span class="tag">载具</span>
            </div>
        </div>
        
                <row>角色</row>

                    <td><span class="tag tag-done">7.565亿</span></td>

    </tbody>
